name: Build & Release APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Setup EAS CLI
        working-directory: mobile
        run: npm install -g eas-cli

      - name: Login to Expo
        working-directory: mobile
        run: eas login --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        id: eas-build
        working-directory: mobile
        run: |
          BUILD_JSON=$(eas build --platform android --profile production --non-interactive --json)
          echo "$BUILD_JSON" > build-output.json
          BUILD_ID=$(echo "$BUILD_JSON" | jq -r '.[0].id')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

      - name: Wait for build to complete
        working-directory: mobile
        run: |
          BUILD_ID="${{ steps.eas-build.outputs.build_id }}"
          echo "Waiting for build $BUILD_ID to complete..."
          while true; do
            STATUS=$(eas build:view "$BUILD_ID" --json | jq -r '.status')
            echo "Build status: $STATUS"
            if [ "$STATUS" = "finished" ]; then
              break
            elif [ "$STATUS" = "errored" ]; then
              echo "Build failed!"
              exit 1
            fi
            sleep 30
          done

      - name: Get build artifact URL
        id: artifact
        working-directory: mobile
        run: |
          BUILD_ID="${{ steps.eas-build.outputs.build_id }}"
          BUILD_URL=$(eas build:view "$BUILD_ID" --json | jq -r '.artifacts.buildUrl')
          echo "url=$BUILD_URL" >> $GITHUB_OUTPUT

      - name: Download APK
        run: |
          mkdir -p artifacts
          curl -L -o artifacts/quran-reel-detector.apk "${{ steps.artifact.outputs.url }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: artifacts/quran-reel-detector.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
